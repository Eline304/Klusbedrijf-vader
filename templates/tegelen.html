<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8">
    <title>Tegelen | Portfolio</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/portfolio.style.css">
    <link rel="stylesheet" href="../style/portfolio.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
</head>

<body>

    <header>
        <h1>Klus en onderhoudsbedrijf Vader</h1>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="about.html">Over mij</a></li>
            <li><a href="portfolio.html" class="active">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </header>

    <section class="project-hero">
        <h2>Tegelen</h2>
            <p></p>
    </section>

    <main class="project-gallery">

        <div class="gallery-grid">
            <img src="../images/tegelen/tegelen.jpg" alt="Tegelen project foto 1">
            <img src="../images/tegelen/tegelen2.jpg" alt="Tegelen project foto 2">
            <img src="../images/tegelen/tegelen3.jpg" alt="tegelen project foto 3">
            <img src="../images/tegelen/tegelen4.jpg" alt="Tegelen project foto 4">
            <img src="../images/tegelen/tegelen5.jpg" alt="Tegelen project foto 5">
            <img src="../images/tegelen/tegelen6.jpg" alt="Tegelen project foto 6">
            <img src="../images/tegelen/tegelen8.jpg" alt="Tegelen project foto 8">
        </div>

    </main>

    <footer>
        © Gert Vader – Klus & Onderhoud
    </footer>

        <script>
        var images = document.querySelectorAll('.gallery-grid img');
        var modal = document.createElement('div');
        var modalImg = document.createElement('img');
        var closeBtn = document.createElement('span');

        modal.classList.add('modal');
        closeBtn.classList.add('close');
        closeBtn.innerHTML = '&times;';
        modal.appendChild(closeBtn);
        modal.appendChild(modalImg);
        document.body.appendChild(modal);

        images.forEach(function (img) {
            img.addEventListener('click', function () {
                modal.style.display = 'block';
                modalImg.src = img.src;
            });
        });

        closeBtn.addEventListener('click', function () {
            modal.style.display = 'none';
        });

        window.addEventListener('click', function (event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>

</html>
